<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dates</title>
</head>
<body>
    <script>

        let takeDate = new Date();

        console.log(takeDate); 
        //Tue Feb 03 2026 10:00:33 GMT+0530 (India Standard Time)

        console.log(takeDate.getFullYear()); //2026
        console.log(takeDate.getHours());  //10
        console.log(takeDate.getMinutes()); //2
        console.log(takeDate.getMonth());  //1
        console.log(takeDate.getDay()); //2
        console.log(takeDate.getMilliseconds());  //297
         console.log(takeDate.getTime());  //297

            console.log(document.location)

        </script>
</body>
</html>
