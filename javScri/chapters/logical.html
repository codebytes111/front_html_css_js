<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators</title>
</head>
<body>
    <script>
    let age = 12;

    console.log(age>18);
    console.log(age<18);
    if(age>18 && age <65){
        console.log('you can drive');
    }
    else{
        console.log('you need to use a bicycle');
    }

    age=25;
    if(age>18 || age>50){
        console.log('drive a bike')
    }
    else{
        console.log('need bicycle')
    }

    age=30;
    console.log(!age<20); //true
    console.log(age<20);  //false
    </script>
</body>
</html>

<!-- compared to assignment and comparison logical operators are lower -->
