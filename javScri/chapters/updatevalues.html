            let money = 0;
            console.log("intial money = "+money);

            money+=10;
            console.log(" money+=10 = "+money); //10
            money-=1;
            console.log(" money-=1 = "+money); //9
            money*=5;
            console.log(" money*=5 = "+money); //45
            money/=9;
            console.log(" money/=9 = "+money); //5
            money%=5;
            console.log(" money%=5 = "+money); //0
            money++;
            console.log(" money++ = "+money); //1
