<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshift and shift</title>
</head>
<body>
    <script>
        let arr = [1,2,3];
        console.log(arr.unshift(54));
        console.log(arr);
        //unshift adds elements from front and also it returns length when assigned to a variable or print the statement.
        //arr.shift();
        console.log(arr.shift()) ;
        console.log(arr);

        </script>
</body>
</html>
