<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Bag</title>
    <style>
        /* div{
            display:flex;
            flex-direction:row;
            justify-content: space-around;
        } */
         #b2{
            padding:5px 40px;
            text-transform: uppercase;
         }
        .b{
            padding:5px 20px;
            border-radius:9px;
            background-color:lightgreen;
            border:none;
            font-weight: 600;
        }
        #b2:hover{
            background-color: aliceblue;
            outline:2px solid black;
        }
        span{
            position:relative;
            bottom:1px;
            right:2px;
        }

    </style>
</head>
<body>
    <div>
        <button id="b1" class="b" onclick="cartQuantity++; document.querySelector('#cartSummary').innerHTML = `Your Bag has ${cartQuantity} items`;">Add to Bag</button>
        <button id="b2" class="b" onclick="cartQuantity--; document.querySelector('#cartSummary').innerHTML = `Your Bag has ${cartQuantity} items`;"><span>❤️</span>move to wishlist</button>
        <button id="b3" class="b" onclick="cartQuantity+=2; document.querySelector('#cartSummary').innerHTML = `Your Bag has ${cartQuantity} items`;">Add 1+1 sale item</button>
    </div>
    <h1 id="cartSummary"></h1>

    <script>
        let cartQuantity = 0;
        document.querySelector('#cartSummary').innerHTML = `Your Bag has ${cartQuantity} items`;
        </script>
</body>
</html>
