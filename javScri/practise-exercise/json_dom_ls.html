<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json local storage date and dom</title>
</head>
<body>

    <h1 id="greet"></h1>
    <button id="btn" style = "height:250px;width:250px; 
    font-size: 40px;"></button>
    
    <script>
        
        let y = Number(localStorage.getItem("clickCount"))|| 0 ;
       
        let btn = document.getElementById("btn");
         btn.innerHTML = y;
        if(y%2==0){
                document.body.style.backgroundColor = 'red';
            }
            else{
                document.body.style.backgroundColor = 'yellow';
            }

        btn.addEventListener("click", function() {
        y++;
        btn.innerHTML = y;
            if(y%2==0){
                document.body.style.backgroundColor = 'red';
            }
            else{
                document.body.style.backgroundColor = 'yellow';
            }

             localStorage.setItem("clickCount",y);
        });

        


        let greet = document.getElementById("greet");
            

        let user = 'Deepu';
 
        function displaytime(){

        let mydate = new Date();

        let currentHours = mydate.getHours();
        let currentMinute = mydate.getMinutes();
        let x = currentHours+":"+currentMinute;

        let greeting;

            if(currentHours >=12 && currentHours <17 ) greeting = " Good Afternoon!";
            else if ( currentHours>=17 && currentHours <19) greeting = " Good Evening!";
            else if ( currentHours>=19 && currentHours <24)  greeting = " Good Night!";
            else greeting = "Good Morning!";

            //   if(currentHours >=12 && currentHours <17 ) return " Good Afternoon!";
            // else if ( currentHours>=17 && currentHours <19) return " Good Evening!";
            // else if ( currentHours>=19 && currentHours <24)  return " Good Night!";
            // else return "Good Morning!"

             
            return "Hey! "+user+" The time is " +x+" & it's"+greeting;
           
        };

        // setInterval(function() {

            // let x = console.log(displaytime());
            // greet.innerHTML = x;
             greet.innerHTML = displaytime();
        // displaytime();

        // },60000);


</script>
</body>
</html>
