<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="myntra.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>
<body>
    <header>
        <div class="logo"><a href="#"><img class="myntra_home" src="images/myntra_logo.webp" alt="myntra_home"></a></div>
        <div class="navbar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio<sup>NEW</sup></a>
        </div>
        <div class="searchbar">
            <span class="material-symbols-outlined searchicon">search</span>
        <input class="searchinput" placeholder="Search for products, brands and more">
        </div>
        <div class="actionbar">
            <div class="action_container">
                <span class="action_name">profile</span>
                <div>
        </div>
    </header>

    <main>
        <div class="banner">banner</div>
        <div class="category_heading">category heading</div>
        <div class="category_items">items</div>
    </main>
    <footer>
        Footer
    </footer>

</html>
