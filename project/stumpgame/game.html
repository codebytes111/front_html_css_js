    <main>

        <div id="ball" class="box"onclick="
            computerChoice = randomGuess();

            showResult('Ball',computerChoice,result);

   function resetScore() {
  score = { win: 0, lost: 0, tie: 0 };

   document.getElementById('lost').textContent = 'Lost: 0';

 }

    function randomGuess(){
         let computerChoice; // make it local variable and the
                             // function doesn`t work.
    let randomNumber = Math.random() * 3;
    

    if(randomNumber > 0 && randomNumber <= 1){
        return 'Bat';
    }
    else if(randomNumber > 1 && randomNumber <= 2){
        return 'Ball';
    }
    else if(randomNumber > 2 && randomNumber <= 3){
        return 'Stump';
    }
    // console.log(`The computer choice is ${computerChoice}`);
    // alert(`The computer choice is ${computerChoice}`);
}

function getResult(userMove, computerMove) {

 if(userMove === 'Bat'){

      if(computerMove == 'Bat'){

 }

 else if (userMove === 'Ball') {

 }
}
 function showResult(userMove,computerMove,result){
